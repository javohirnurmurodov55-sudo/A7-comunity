<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A7 FX Academy - Student Portal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }
        h2 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 25px;
            font-size: 24px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        input {
            width: 100%;
            padding: 14px 16px;
            background: #334155;
            border: 1px solid #475569;
            border-radius: 10px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: #38bdf8;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #0284c7;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }
        button:hover {
            background: #0369a1;
        }
        #welcomeSection {
            display: none;
            text-align: center;
        }
        #greeting {
            font-size: 20px;
            color: #4ade80;
            margin-bottom: 20px;
            line-height: 1.5;
            font-weight: 600;
        }
        .menu-box {
            background: #334155;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
            color: #e2e8f0;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .menu-box:hover {
            background: #475569;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>A7 FX Academy</h2>
        
        <!-- Kirish Formasi -->
        <div id="loginForm">
            <div class="input-group">
                <input type="text" id="name" placeholder="Ismingiz">
            </div>
            <div class="input-group">
                <input type="text" id="surname" placeholder="Familiyangiz">
            </div>
            <div class="input-group">
                <input type="text" id="phone" placeholder="Telefon raqamingiz">
            </div>
            <button onclick="registerStudent()">Kirish</button>
