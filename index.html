<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A7 FX Academy - Student Portal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 0;
        }
        .container {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }
        h2 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 25px;
            font-size: 24px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        input {
            width: 100%;
            padding: 14px 16px;
            background: #334155;
            border: 1px solid #475569;
            border-radius: 10px;
            color: white;
            font-size: 15px;
            outline: none;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #0284c7;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        #welcomeSection {
            display: none;
            text-align: center;
        }
        #greeting {
            font-size: 20px;
            color: #4ade80;
            margin-bottom: 20px;
            line-height: 1.5;
            font-weight: 600;
        }
        .menu-box {
            background: #334155;
            padding: 14px;
            border-radius: 10px;
            margin-top: 12px;
            color: #e2e8f0;
            font-size: 15px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>A7 FX Academy</h2>
        
        <!-- Kirish Formasi -->
        <div id="loginForm">
            <div class="input-group">
                <input type="text" id="name" placeholder="Ismingiz">
            </div>
            <div class="input-group">
                <input type="text" id="surname" placeholder="Familiyangiz">
            </div>
            <div class="input-group">
                <input type="text" id="phone" placeholder="Telefon raqamingiz">
            </div>
            <button type="button" onclick="registerStudent()">Kirish</button>
        </div>

        <!-- Salomlashish va Asosiy Menyu Bo'limi -->
        <div id="welcomeSection">
            <div id="greeting"></div>
            <div class="menu-box">📊 Signallar bo'limi <span>➔</span></div>
            <div class="menu-box">📝 Mening Savdo Jurnalim <span>➔</span></div>
            <div class="menu-box">📚 Darsliklar va Kurslar <span>➔</span></div>
            <div class="menu-box">🧮 Trading Kalkulyator <span>➔</span></div>
        </div>
    </div>

    <script>
        function registerStudent() {
            const name = document.getElementById('name').value.trim();
            const surname = document.getElementById('surname').value.trim();
            const phone = document.getElementById('phone').value.trim();

            if (name === '' || surname === '' || phone === '') {
                alert('Iltimos, barcha maydonlarni to\'ldiring!');
                return;
            }

            // Test uchun xabar
            alert("Ma'lumot qabul qilindi!");

            // Formani yashirib, salomlashuv va menyuni chiqarish
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('welcomeSection').style.display = 'block';
            
            document.getElementById('greeting').innerHTML = `Assalomu alaykum ${name} ${surname}, communityga xush kelibsiz!`;
        }
    </script>

</body>
</html>
